---
layout: default
---

<div class="post-shell page-width">
  <a class="back-link" href="{{ '/' | relative_url }}#notes">← Back to notes</a>
  <article class="post">
    <header class="post__header">
      <p class="eyebrow">NOTE / {{ page.date | date: '%Y.%m.%d' }}</p>
      <h1>{{ page.title }}</h1>
      {% if page.description %}<p class="post__dek">{{ page.description }}</p>{% endif %}
      {% if page.tags %}
        <ul class="tag-list" aria-label="Tags">
          {% for tag in page.tags %}<li>{{ tag }}</li>{% endfor %}
        </ul>
      {% endif %}
    </header>
    <div class="post__content">
      {{ content }}
    </div>
    <footer class="post__footer">
      <span>End of note</span>
      <a href="{{ '/' | relative_url }}#notes">More notes ↗</a>
    </footer>
  </article>
</div>
