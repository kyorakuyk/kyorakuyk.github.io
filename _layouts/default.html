<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="canonical" href="{{ site.url }}{{ site.baseurl }}{{ page.url }}">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
    {% feed_meta %}
    <title>{{ page.title | default: site.title | escape }}</title>
  </head>
  <body class="{% if page.url == '/' %}is-home state-splash{% else %}is-page state-sidebar{% endif %}">
    <script>
      // Prevent FOUC: instantly restore layout state on load
      if (document.body.classList.contains('is-home')) {
        if (sessionStorage.getItem('splashClosed') === 'true') {
          document.body.classList.remove('state-splash');
          document.body.classList.add('state-sidebar');
        }
        if (sessionStorage.getItem('notesActive') === 'true') {
          document.body.classList.add('view-notes-active');
        }
      }
    </script>
    <div id="layout-wrapper">
      {% include sidebar.html %}
      
      <main id="main-content">
        {{ content }}
      </main>
    </div>

    <script src="{{ '/assets/js/interaction.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/tag-filter.js' | relative_url }}"></script>
  </body>
</html>
