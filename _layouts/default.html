<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="canonical" href="{{ site.url }}{{ site.baseurl }}{{ page.url }}">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
    {% feed_meta %}
    <title>{{ page.title | default: site.title | escape }}</title>
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner page-width">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="Kyorakuyk home">
          <span class="brand__mark">K/</span>
          <span class="brand__name">KYORAKUYK</span>
        </a>
        <nav class="site-nav" aria-label="Primary navigation">
          <a href="{{ '/' | relative_url }}#notes">Notes</a>
          <a href="{{ '/about/' | relative_url }}">About</a>
          <a href="https://github.com/kyorakuyk" target="_blank" rel="noreferrer">GitHub <span aria-hidden="true">↗</span></a>
        </nav>
      </div>
    </header>

    {{ content }}

    <footer class="site-footer page-width">
      <span>© {{ site.time | date: '%Y' }} Kyorakuyk</span>
      <span>Written in Markdown · Published on GitHub Pages</span>
    </footer>
  </body>
</html>
